<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tienda Manzanitas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&amp;family=Nunito:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
:root {
  /* Vidriera de marroquinería artesanal: blanco y rosa, la puntada del logo como hilo conductor. Celular primero; dos columnas desde 860px. */
  --bg: #FFF5F8;
  --surface: #FFFFFF;
  --ink: #2B1A20;
  --muted: #6E5560;
  --accent: #D6286A;
  --accent-text: #C91E5E;
  --stitch: #EE3875;
  --stitch-soft: #F7A8C4;
  --blush: #FCE4EC;
  --line: #F2D3DE;
  --ok-bg: #E3F4EA; --ok: #1E6B45;
  --cash-bg: #FFF1DC; --cash: #7A4A00;
  --err: #B3261E;
  --font-display: 'Dancing Script', 'Brush Script MT', cursive;
  --font-body: 'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
img, svg { max-width: 100%; }
a { color: var(--accent-text); }
button, input, textarea { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; line-height: 1.15; margin: 0; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
h1:focus, h1:focus-visible, main:focus { outline: none; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); font-weight: 600; }
.wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 16px; }
.script { font-family: var(--font-display); font-weight: 700; }
.stitch { position: relative; }
.stitch::after { content: ""; position: absolute; inset: 6px; border: 1.5px dashed var(--stitch-soft); border-radius: calc(var(--r, 22px) - 6px); pointer-events: none; }

/* Barra de prototipo */
.demo { background: var(--ink); color: #FFFFFF; font-size: 12.5px; font-weight: 700; text-align: center; padding: 6px 12px; }

/* Encabezado */
.top { position: sticky; top: 0; z-index: 30; background: var(--surface); border-bottom: 1.5px dashed var(--stitch-soft); }
.top-in { display: flex; align-items: center; gap: 4px; min-height: 64px; padding-top: 6px; padding-bottom: 6px; }
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); margin-right: auto; padding: 2px 6px 2px 2px; border-radius: 14px; }
.brand img { width: 44px; height: 44px; }
.brand span { font-family: var(--font-display); font-weight: 700; font-size: 29px; line-height: 1; }
.icon-btn { position: relative; width: 44px; height: 44px; flex: 0 0 44px; display: inline-flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: 12px; cursor: pointer; color: var(--ink); text-decoration: none; }
.icon-btn:hover { background: var(--blush); }
.badge { position: absolute; top: 2px; right: 0; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: #FFFFFF; font-size: 11.5px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
.badge[hidden] { display: none; }
.badge.bump { animation: bump .45s ease; }
@keyframes bump { 30% { transform: scale(1.35); } 100% { transform: scale(1); } }
.nav-cats { display: none; }
.cart-lg { display: none; }
@media (min-width: 860px) {
  .wrap { padding: 0 32px; }
  .brand { margin-right: 12px; }
  .cart-sm { display: none; }
  .cart-lg { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 8px 0 14px; margin-left: 6px; border-radius: 999px; background: var(--accent); color: #FFFFFF; text-decoration: none; font-weight: 800; font-size: 15px; }
  .cart-lg:hover { background: #C21F5E; color: #FFFFFF; }
  .cart-lg .pill-n { background: #FFFFFF; color: #A3154A; border-radius: 999px; padding: 3px 10px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .brand { margin-right: auto; }
}
@media (min-width: 1180px) {
  .brand { margin-right: 12px; }
  .nav-cats { display: flex; gap: 2px; margin-right: auto; }
  .nav-cats a { min-height: 44px; display: flex; align-items: center; padding: 0 11px; border-radius: 999px; text-decoration: none; color: var(--ink); font-weight: 800; font-size: 14.5px; }
  .nav-cats a:hover { background: var(--blush); }
  .nav-cats a[aria-current="page"] { background: var(--ink); color: #FFFFFF; }
}

/* Botones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 24px; border-radius: 999px; border: 0; font-weight: 800; font-size: 16px; line-height: 1.2; text-decoration: none; cursor: pointer; text-align: center; transition: transform .15s ease, background-color .15s ease; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); color: #FFFFFF; box-shadow: 0 8px 18px rgba(214, 40, 106, .25); }
.btn-primary:hover { background: #C21F5E; color: #FFFFFF; }
.btn-ghost { background: var(--surface); color: var(--ink); border: 1.5px dashed var(--stitch); }
.btn-ghost:hover { background: var(--blush); color: var(--ink); }
.btn-block { width: 100%; }
.link-btn { background: none; border: 0; padding: 0 8px; min-height: 44px; color: var(--accent-text); font-weight: 800; text-decoration: underline; cursor: pointer; }

/* Secciones comunes */
main { display: block; min-height: 60vh; padding-bottom: 40px; }
.sec { padding-top: 28px; display: flex; flex-direction: column; gap: 14px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sec-head h2 { font-size: 22px; font-weight: 900; }
.sec-head span { font-size: 13.5px; color: var(--muted); font-weight: 700; }
.panel { background: var(--surface); border-radius: 22px; padding: 16px; --r: 22px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 800; color: var(--muted); background: var(--blush); padding: 3px 10px; border-radius: 999px; }
.back { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; margin: 8px 0 4px -8px; padding: 0 12px 0 4px; border-radius: 12px; color: var(--ink); text-decoration: none; font-weight: 800; }
.back:hover { background: var(--blush); }
.note { display: flex; gap: 10px; align-items: flex-start; background: var(--blush); border-radius: 16px; padding: 12px 14px; font-size: 14px; line-height: 1.45; }
.note svg { flex: 0 0 auto; color: var(--accent-text); margin-top: 1px; }
.fine { font-size: 13px; line-height: 1.45; color: var(--muted); }

/* Inicio */
.hero { padding-top: 16px; }
.hero-card { --r: 30px; background: var(--surface); border-radius: 30px; padding: 22px 20px 26px; display: grid; gap: 14px; justify-items: center; text-align: center; box-shadow: 0 12px 34px rgba(214, 40, 106, .08); }
.hero-logo { order: -1; width: 168px; }
.hero-logo img { display: block; width: 100%; height: auto; }
.eyebrow { font-size: 12.5px; font-weight: 900; letter-spacing: .6px; text-transform: uppercase; color: #A3154A; }
.hero h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(34px, 9vw, 64px); line-height: 1.04; margin-top: 4px; }
.lead { font-size: 16px; line-height: 1.55; color: var(--muted); max-width: 34em; margin-top: 10px; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 16px; }
.feats { padding-top: 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.feat { background: var(--surface); border-radius: 16px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font-size: 12.5px; font-weight: 800; line-height: 1.25; }
.feat span:first-child { width: 36px; height: 36px; border-radius: 50%; background: var(--blush); color: var(--accent-text); display: flex; align-items: center; justify-content: center; }
.cat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.cat-card { --r: 22px; background: var(--surface); border-radius: 22px; padding: 14px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: var(--ink); transition: transform .15s ease, box-shadow .15s ease; }
.cat-card:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(214, 40, 106, .12); color: var(--ink); }
.cat-art { width: 108px; height: 108px; border-radius: 50%; background: var(--blush); display: flex; align-items: center; justify-content: center; margin-bottom: 4px; }
.cat-art svg { width: 92px; height: 92px; }
.cat-name { font-size: 16px; font-weight: 800; }
.cat-count { font-size: 13px; color: var(--muted); font-weight: 600; }
.row-scroll { display: flex; gap: 12px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 8px; scroll-snap-type: x mandatory; scrollbar-width: none; }
.row-scroll::-webkit-scrollbar { display: none; }
.row-scroll > * { flex: 0 0 160px; scroll-snap-align: start; }
.m-card { --r: 20px; background: var(--surface); border-radius: 20px; padding: 10px; display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: var(--ink); transition: transform .15s ease, box-shadow .15s ease; }
.m-card:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(214, 40, 106, .12); color: var(--ink); }
.m-art { aspect-ratio: 1 / 1; border-radius: 14px; background: var(--blush); display: flex; align-items: center; justify-content: center; margin-bottom: 4px; }
.m-art svg { width: 86%; height: 86%; }
.m-name { font-size: 14.5px; font-weight: 800; padding: 0 4px; line-height: 1.3; }
.m-price { font-size: 16px; font-weight: 900; color: var(--accent-text); padding: 0 4px 4px; font-variant-numeric: tabular-nums; }
@media (min-width: 640px) { .cat-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 860px) {
  .hero { padding-top: 28px; }
  .hero-card { grid-template-columns: minmax(0, 1fr) 340px; justify-items: start; text-align: left; padding: 40px 44px; align-items: center; gap: 32px; }
  .hero-logo { order: 0; width: 340px; }
  .hero-cta { justify-content: flex-start; }
  .lead { font-size: 18px; }
  .feats { gap: 16px; }
  .feat { flex-direction: row; justify-content: center; font-size: 15px; padding: 14px; }
  .sec { padding-top: 40px; gap: 18px; }
  .sec-head h2 { font-size: 28px; }
  .row-scroll { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 0; padding: 0; overflow: visible; }
}
@media (min-width: 1000px) { .cat-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); } }

/* Vitrina */
.pills { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; margin: 0 -16px; scrollbar-width: none; }
.pills::-webkit-scrollbar { display: none; }
.pill { flex: 0 0 auto; min-height: 44px; display: flex; align-items: center; padding: 0 18px; border-radius: 999px; border: 1.5px dashed var(--stitch-soft); background: var(--surface); color: var(--ink); font-size: 14.5px; font-weight: 800; text-decoration: none; }
.pill:hover { background: var(--blush); color: var(--ink); }
.pill[aria-current="page"] { background: var(--ink); border-color: var(--ink); color: #FFFFFF; }
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.toolbar h1 { font-size: 19px; font-weight: 900; display: flex; align-items: baseline; gap: 8px; }
.toolbar h1 span { font-size: 13.5px; font-weight: 700; color: var(--muted); }
.seg { display: flex; gap: 2px; padding: 3px; background: var(--surface); border-radius: 999px; border: 1.5px solid var(--line); }
.seg button { width: 44px; height: 40px; border: 0; border-radius: 999px; background: transparent; color: var(--ink); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #FFFFFF; }
.stage { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-areas: "name" "price" "art" "dots" "cta"; justify-items: center; text-align: center; padding-top: 14px; column-gap: 40px; }
.stage-name { grid-area: name; font-size: clamp(36px, 10vw, 54px); line-height: 1.08; }
.stage-price { grid-area: price; font-size: 32px; font-weight: 900; color: var(--accent-text); letter-spacing: -.4px; font-variant-numeric: tabular-nums; }
.stage-desc { grid-area: desc; display: none; color: var(--muted); font-size: 17px; line-height: 1.55; max-width: 30em; }
.stage-art { grid-area: art; justify-self: center; width: min(264px, 66vw); aspect-ratio: 1 / 1; margin-top: 12px; border-radius: 50%; background: var(--blush); outline: 2px dashed var(--stitch); outline-offset: -12px; display: flex; align-items: center; justify-content: center; touch-action: pan-y; user-select: none; -webkit-user-drag: none; }
.stage-art:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.stage-art svg { width: 84%; height: 84%; pointer-events: none; }
.stage-art.in-next svg { animation: inNext .32s ease both; }
.stage-art.in-prev svg { animation: inPrev .32s ease both; }
@keyframes inNext { from { opacity: 0; transform: translateY(24px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes inPrev { from { opacity: 0; transform: translateY(-24px) scale(.96); } to { opacity: 1; transform: none; } }
.stage-nav { grid-area: art; justify-self: end; align-self: center; display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 12px; }
.round { width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 10px rgba(43, 26, 32, .06); }
.round.dark { background: var(--ink); color: #FFFFFF; border-color: var(--ink); }
.round:hover { border-color: var(--stitch); }
.counter { font-size: 13px; font-weight: 900; background: var(--surface); padding: 4px 10px; border-radius: 999px; border: 1.5px dashed var(--stitch-soft); font-variant-numeric: tabular-nums; }
.dots { grid-area: dots; display: flex; align-items: center; gap: 0; margin-top: 8px; }
.dot { width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
.dot span { width: 24px; height: 24px; border-radius: 50%; background: var(--c); border: 2px solid #FFFFFF; box-shadow: 0 0 0 1.5px #D9B8C4; }
.dot[aria-pressed="true"] span { box-shadow: 0 0 0 2.5px var(--ink); }
.dot-label { font-size: 13.5px; font-weight: 700; color: var(--muted); margin-left: 6px; }
.stage-cta { grid-area: cta; margin-top: 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.hint { font-size: 12.5px; color: var(--muted); text-align: center; }
.m-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding-top: 14px; }
@media (min-width: 860px) {
  .pills { margin: 0; padding: 18px 0 14px; }
  .toolbar h1 { font-size: 24px; }
  .stage { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "art name" "art price" "art desc" "art dots" "art cta"; grid-template-rows: auto auto auto auto 1fr; justify-items: start; text-align: left; padding-top: 24px; align-items: start; }
  .stage-name { align-self: end; margin-top: 40px; }
  .stage-desc { display: block; margin-top: 10px; }
  .stage-art { width: min(440px, calc(100% - 60px)); margin-top: 0; justify-self: start; }
  .stage-nav { margin-top: 0; }
  .stage-cta { align-items: flex-start; margin-top: 18px; }
  .m-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
}

/* Detalle */
.det-grid { display: grid; gap: 18px; }
.det-art { --r: 28px; background: var(--blush); border-radius: 28px; aspect-ratio: 1 / 1; max-height: 340px; width: 100%; display: flex; align-items: center; justify-content: center; }
.det-art::after { border: 2px dashed var(--stitch); inset: 12px; border-radius: 18px; }
.det-art svg { width: 78%; height: 78%; }
.det-info { display: flex; flex-direction: column; gap: 18px; }
.det-info h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(36px, 9vw, 52px); line-height: 1.08; }
.det-price { font-size: 28px; font-weight: 900; color: var(--accent-text); font-variant-numeric: tabular-nums; margin-top: 2px; }
.det-desc { font-size: 15.5px; line-height: 1.55; color: var(--muted); margin-top: 6px; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { padding: 0; }
.swatches { display: flex; gap: 10px; margin-top: 10px; }
.swatch { width: 48px; height: 48px; border-radius: 50%; border: 2.5px solid transparent; background: var(--surface); padding: 4px; cursor: pointer; }
.swatch span { display: block; width: 100%; height: 100%; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgba(43, 26, 32, .15); }
.swatch[aria-pressed="true"] { border-color: var(--ink); }
.box { --r: 20px; background: var(--surface); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.box-head { display: flex; align-items: center; justify-content: space-between; }
.box-head h2 { font-size: 16.5px; font-weight: 900; }
.check { display: flex; align-items: center; gap: 12px; min-height: 48px; cursor: pointer; font-weight: 700; }
.check input { width: 22px; height: 22px; margin: 0; accent-color: var(--accent); flex: 0 0 auto; }
.check strong { margin-left: auto; color: var(--accent-text); font-weight: 900; white-space: nowrap; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field[hidden] { display: none; }
.field label { font-size: 14.5px; font-weight: 800; }
.field input, .field textarea { width: 100%; min-height: 48px; border-radius: 14px; border: 1.5px solid #E2BACB; padding: 10px 14px; font-size: 16px; background: #FFFBFC; }
.field textarea { resize: vertical; min-height: 88px; }
.field input:focus, .field textarea:focus { outline: 3px solid rgba(214, 40, 106, .35); outline-offset: 1px; border-color: var(--accent); }
.field input[aria-invalid="true"] { border-color: var(--err); }
.help { font-size: 13px; color: var(--muted); }
.err { font-size: 13.5px; color: var(--err); font-weight: 800; }
.err[hidden] { display: none; }
.qty { display: flex; align-items: center; border: 1.5px solid var(--line); border-radius: 999px; background: var(--surface); }
.qty button { width: 44px; height: 46px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 50%; color: var(--ink); }
.qty button:disabled { color: #C9AEB8; cursor: default; }
.qty output, .qty span { min-width: 22px; text-align: center; font-size: 17px; font-weight: 900; font-variant-numeric: tabular-nums; }
.buybar { position: sticky; bottom: 0; z-index: 5; display: flex; gap: 12px; align-items: center; background: var(--surface); margin: 0 -16px; padding: 12px 16px 14px; border-top: 1.5px dashed var(--stitch-soft); }
.buybar .btn { flex: 1; }
@media (min-width: 860px) {
  .det-grid { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 48px; align-items: start; padding-top: 8px; }
  .det-art { max-height: none; position: sticky; top: 96px; }
  .buybar { position: static; margin: 0; padding: 0; border: 0; background: transparent; }
}

/* Carrito */
.page-title { font-size: 26px; font-weight: 900; margin: 4px 0 14px; }
.two { display: grid; gap: 16px; align-items: start; }
.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.item { background: var(--surface); border-radius: 20px; padding: 12px; display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; grid-template-areas: "art body del" "art qty total"; column-gap: 12px; row-gap: 8px; }
.item-art { grid-area: art; width: 84px; height: 84px; border-radius: 14px; background: var(--blush); display: flex; align-items: center; justify-content: center; }
.item-art svg { width: 74px; height: 74px; }
.item-body { grid-area: body; min-width: 0; }
.item-body h2 { font-size: 15.5px; font-weight: 800; }
.item-det { font-size: 13px; color: var(--muted); line-height: 1.4; overflow-wrap: anywhere; }
.item-unit { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.item .del { grid-area: del; align-self: start; margin: -6px -6px 0 0; color: var(--muted); }
.item .qty { grid-area: qty; justify-self: start; }
.item .qty button { width: 40px; height: 42px; }
.item-total { grid-area: total; align-self: center; font-size: 16.5px; font-weight: 900; color: var(--accent-text); font-variant-numeric: tabular-nums; }
.sum { display: flex; flex-direction: column; gap: 10px; }
.sum h2 { font-size: 18px; font-weight: 900; }
.sum-row { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; }
.sum-row span:first-child { color: var(--muted); font-weight: 700; }
.sum-row strong { font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
.sum-line { display: flex; justify-content: space-between; gap: 12px; font-size: 14.5px; }
.sum-line strong { font-variant-numeric: tabular-nums; white-space: nowrap; }
.sum-total { border-top: 1.5px dashed var(--stitch-soft); padding-top: 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.sum-total span { font-size: 17px; font-weight: 900; }
.sum-total strong { font-size: 22px; font-weight: 900; color: var(--accent-text); font-variant-numeric: tabular-nums; text-align: right; }
.empty { --r: 24px; background: var(--surface); border-radius: 24px; padding: 32px 20px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty h1 { font-size: 22px; font-weight: 900; }
@media (min-width: 860px) {
  .page-title { font-size: 32px; }
  .two { grid-template-columns: minmax(0, 1fr) 380px; gap: 28px; }
  .two > aside { position: sticky; top: 96px; }
}

/* Finalizar */
.steps { display: flex; flex-direction: column; gap: 14px; }
.steps legend { font-size: 17px; font-weight: 900; display: flex; align-items: center; gap: 8px; margin-bottom: 0; }
.num { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: #FFFFFF; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; }
.steps fieldset > * + * { margin-top: 12px; }
.opt { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; }
.opt:has(input:checked) { border-color: var(--accent); background: #FFF0F5; }
.opt input { margin: 0; width: 20px; height: 20px; accent-color: var(--accent); flex: 0 0 auto; }
.opt-ico { flex: 0 0 38px; height: 38px; border-radius: 50%; background: var(--blush); color: var(--accent-text); display: flex; align-items: center; justify-content: center; }
.opt-txt { display: flex; flex-direction: column; }
.opt-txt strong { font-size: 15.5px; font-weight: 800; }
.opt-txt span { font-size: 13px; color: var(--muted); line-height: 1.4; }
.banner { display: flex; gap: 10px; align-items: flex-start; background: #FDECEA; color: var(--err); border-radius: 16px; padding: 12px 14px; font-weight: 800; font-size: 14.5px; }
.banner[hidden] { display: none; }

/* Confirmación */
.narrow { max-width: 640px; }
.conf { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding-top: 24px; }
.conf-check { --r: 50px; width: 96px; height: 96px; border-radius: 50%; background: var(--blush); color: var(--accent-text); display: flex; align-items: center; justify-content: center; }
.conf h1 { font-family: var(--font-display); font-weight: 700; font-size: 44px; line-height: 1.08; }
.conf-sub { font-size: 17px; font-weight: 800; margin-top: -6px; }
.status { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 800; }
.status.ok { background: var(--ok-bg); color: var(--ok); }
.status.cash { background: var(--cash-bg); color: var(--cash); }
.conf .panel { align-self: stretch; text-align: left; }
.wa { display: flex; flex-direction: column; gap: 10px; }
.wa h2 { font-size: 17px; font-weight: 900; }
.wa > p { font-size: 14.5px; color: var(--muted); line-height: 1.45; }
.preview { margin-top: 4px; }
.preview summary { cursor: pointer; font-weight: 800; min-height: 44px; display: flex; align-items: center; color: var(--accent-text); }
.bubble { background: #F6EAEE; border-radius: 18px; padding: 14px; }
.bubble div { background: var(--surface); border-radius: 16px 16px 16px 6px; padding: 12px 14px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: 0 2px 6px rgba(43, 26, 32, .06); }

/* Barra flotante del pedido (celular) */
.cartbar { position: fixed; left: 16px; right: 16px; bottom: 16px; z-index: 25; height: 60px; border-radius: 999px; background: var(--accent); color: #FFFFFF; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 20px; text-decoration: none; font-weight: 800; font-size: 16px; box-shadow: 0 10px 24px rgba(214, 40, 106, .32); }
.cartbar:hover { color: #FFFFFF; background: #C21F5E; }
.cartbar span:first-child { display: flex; align-items: center; gap: 10px; }
.cartbar .pill-n { background: #FFFFFF; color: #A3154A; border-radius: 999px; padding: 9px 14px; font-weight: 900; font-variant-numeric: tabular-nums; }
body.has-cartbar main { padding-bottom: 100px; }
@media (min-width: 860px) { .cartbar { display: none; } body.has-cartbar main { padding-bottom: 40px; } }

/* Pie */
.foot { background: var(--blush); border-top: 1.5px dashed var(--stitch-soft); }
.foot-in { padding-top: 24px; padding-bottom: 28px; display: flex; flex-wrap: wrap; gap: 14px 40px; justify-content: space-between; align-items: center; }
.foot-brand { display: flex; align-items: center; gap: 10px; }
.foot-brand img { width: 44px; height: 44px; }
.foot-brand span { font-family: var(--font-display); font-weight: 700; font-size: 28px; }
.foot-info { display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.foot-info strong { font-weight: 900; }

/* Capas: menú, búsqueda, pago, aviso */
.layer { position: fixed; inset: 0; z-index: 50; background: rgba(43, 26, 32, .45); display: flex; }
.layer[hidden] { display: none; }
.drawer { background: var(--bg); width: min(420px, 92vw); height: 100%; overflow-y: auto; padding: 16px 18px 28px; display: flex; flex-direction: column; gap: 16px; animation: slideIn .22s ease; }
@keyframes slideIn { from { transform: translateX(-24px); opacity: 0; } to { transform: none; opacity: 1; } }
.layer-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.layer-head h2 { font-family: var(--font-display); font-weight: 700; font-size: 32px; }
.drawer h3 { font-size: 16px; font-weight: 900; margin-bottom: 6px; }
.drawer ol, .drawer ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14.5px; line-height: 1.45; }
.todo { border: 1.5px dashed var(--stitch); border-radius: 14px; padding: 10px 12px; font-size: 14px; color: var(--muted); background: var(--surface); }
.search { background: var(--bg); width: 100%; max-width: 640px; margin: 0 auto; align-self: flex-start; border-radius: 0 0 24px 24px; padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 12px; max-height: 85vh; overflow-y: auto; animation: dropIn .2s ease; }
@keyframes dropIn { from { transform: translateY(-16px); opacity: 0; } to { transform: none; opacity: 1; } }
.search-row { display: flex; gap: 8px; align-items: center; }
.search-row .field { flex: 1; }
.results { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.results a { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: 16px; padding: 8px 12px 8px 8px; text-decoration: none; color: var(--ink); min-height: 64px; }
.results a:hover { background: #FFF0F5; }
.results .r-art { width: 52px; height: 52px; border-radius: 12px; background: var(--blush); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.results .r-art svg { width: 44px; height: 44px; }
.results .r-txt { display: flex; flex-direction: column; }
.results .r-txt span { font-size: 13px; color: var(--muted); }
.results strong { font-weight: 800; }
.modal { background: var(--surface); width: min(460px, calc(100vw - 32px)); margin: auto; border-radius: 26px; padding: 22px; display: flex; flex-direction: column; gap: 14px; animation: dropIn .2s ease; }
.modal h2 { font-size: 21px; font-weight: 900; }
.modal p { font-size: 15px; line-height: 1.5; color: var(--muted); }
.modal-actions { display: flex; flex-direction: column; gap: 8px; }
.toast { position: fixed; left: 50%; top: 96px; transform: translateX(-50%); z-index: 60; background: var(--ink); color: #FFFFFF; border-radius: 999px; padding: 10px 10px 10px 18px; display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 14.5px; box-shadow: 0 12px 26px rgba(43, 26, 32, .25); max-width: calc(100vw - 32px); }
.toast[hidden] { display: none; }
.toast a { color: #FFFFFF; background: rgba(255, 255, 255, .16); border-radius: 999px; padding: 8px 14px; text-decoration: none; white-space: nowrap; }
.toast a:hover { background: rgba(255, 255, 255, .28); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>

  function ico(n, s, sw) {

  function actualizarDetalle() {

  function vFinalizar() {

  function marcarError(id, mal) {
    var input = document.getElementById(id), err = document.getElementById(id + '-err');
    if (input) input.setAttribute('aria-invalid', mal ? 'true' : 'false');
    if (err) err.hidden = !mal;
    return mal;
  }

  function validarPedido() {
    var cl = state.cliente, primero = null;
    var checks = [
      ['f-nombre', cl.nombre.trim().length < 3],
      ['f-tel', cl.tel.replace(/\D/g, '').length < 8],
      ['f-dir', cl.entrega === 'envio' && cl.direccion.trim().length < 4],
      ['f-cambio', cl.pago === 'efectivo' && cl.pagaCon.trim() !== '' && (parseInt(cl.pagaCon.replace(/\D/g, ''), 10) || 0) < subtotal()]
    ];
    checks.forEach(function (c) { if (marcarError(c[0], c[1]) && !primero) primero = c[0]; });
    if (primero) { document.getElementById(primero).focus(); return false; }
    return true;
  }

  function mensajeWhatsApp(p) {
    var c = p.cliente, L = [];
    L.push('*Nuevo pedido #' + p.nro + ' · ' + CONFIG.tienda + '*');
    L.push('Cliente: ' + c.nombre.trim());
    L.push('WhatsApp: ' + c.tel.trim());
    L.push('');
    L.push('*Productos*');
    p.items.forEach(function (it) {
      var m = MODELOS[it.id];
      L.push('• ' + it.cant + ' × ' + m.nombre + ' (' + m.colores[it.color].nombre + ') — ' + money(precioUnit(it) * it.cant));
      if (it.bordado) L.push('   Bordado: «' + it.nombreBordado + '»');
      if (it.notas) L.push('   Nota: ' + it.notas);
    });
    L.push('');
    L.push('Entrega: ' + (c.entrega === 'envio' ? 'Envío a domicilio — ' + c.direccion.trim() : 'Retiro en el taller'));
    var pc = parseInt((c.pagaCon || '').replace(/\D/g, ''), 10);
    L.push('Pago: ' + (p.pago === 'mp' ? 'Mercado Pago — APROBADO' : 'Efectivo' + (pc ? ' — paga con ' + money(pc) : '')));
    L.push('*Total: ' + money(p.total) + '*' + (c.entrega === 'envio' ? ' + envío a coordinar' : ''));
    return L.join('\n');
  }
  function mensajeHtml(msg) { return esc(msg).replace(/\*([^*\n]+)\*/g, '<strong>$1</strong>'); }
  function enlaceWhatsApp(msg) { return 'https://wa.me/' + (CONFIG.whatsapp || '') + '?text=' + encodeURIComponent(msg); }

      : '<span class="status cash">' + ico('cash', 18) + 'Pagás ' + money(p.total) + ' en efectivo ' + (c.entrega === 'envio' ? 'al recibir' : 'al retirar') + '</span>';
    return '<section class="wrap narrow conf">' +
      '<span class="conf-check stitch">' + ico('check', 46, 2.4) + '</span>' +
      '<h1 tabindex="-1">¡Gracias, ' + esc(nombre) + '!</h1>' +
      '<p class="conf-sub">Recibimos tu pedido #' + p.nro + '</p>' + estado +
      '<div class="panel sum">' + resumenLineas(p.items) +
        '<div class="sum-row"><span>Entrega</span><strong>' + (c.entrega === 'envio' ? 'Envío a domicilio' : 'Retiro en el taller') + '</strong></div>' +
        '<div class="sum-total"><span>Total</span><strong>' + money(p.total) + (c.entrega === 'envio' ? ' + envío' : '') + '</strong></div></div>' +
      '<div class="panel stitch wa"><h2>Último paso: envianos el pedido</h2>' +
        '<p>Tocá el botón: se abre WhatsApp con tu pedido ya escrito. Solo tenés que enviarlo.</p>' +
        '<a class="btn btn-primary btn-block" href="' + esc(enlaceWhatsApp(msg)) + '" target="_blank" rel="noopener">' + ico('chat', 22) + 'Enviar pedido por WhatsApp</a>' +
        '<button type="button" class="btn btn-ghost btn-block" data-action="copiar">' + ico('copy', 20) + 'Copiar mensaje</button>' +
        '<p class="fine" id="copia-estado" role="status"></p>' +
        '<details class="preview" open><summary>Mensaje que recibe Manzanitas</summary><div class="bubble"><div>' + mensajeHtml(msg) + '</div></div></details>' +

      '<a class="btn btn-ghost" href="#inicio">Volver a la tienda</a>' +
    '</section>';

  function actualizarEncabezado(ruta) {
    var n = totalUnidades(), t = subtotal();
    var badge = document.getElementById('badge');
    badge.textContent = n; badge.hidden = n === 0;
    document.getElementById('carrito-sm').setAttribute('aria-label', 'Mi pedido: ' + unidades(n));

    document.getElementById('carrito-lg').setAttribute('aria-label', 'Mi pedido: ' + unidades(n) + (n ? ', ' + money(t) : ''));
    var catActual = CAT[ruta] ? ruta : (ruta.indexOf('modelo-') === 0 && MODELOS[ruta.slice(7)] ? MODELOS[ruta.slice(7)].cat : '');
    document.querySelectorAll('.nav-cats a').forEach(function (a) {
      if (a.dataset.cat === catActual) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    var bar = document.getElementById('cartbar');
    var mostrar = n > 0 && (ruta === '' || ruta === 'inicio' || !!CAT[ruta]);
    bar.hidden = !mostrar;
    document.body.classList.toggle('has-cartbar', mostrar);
    if (mostrar) bar.innerHTML = '<span>' + ico('bag', 22) + 'Ver mi pedido</span><span class="pill-n">' + n + ' · ' + money(t) + '</span>';

  var capaAbierta = null, focoPrevio = null;
  function abrirCapa(id, foco) {
    cerrarCapa();
    focoPrevio = document.activeElement;
    capaAbierta = document.getElementById(id);
    capaAbierta.hidden = false;
    document.body.style.overflow = 'hidden';
    var f = foco ? document.getElementById(foco) : capaAbierta.querySelector('button, a, input');
    if (f) f.focus();
  }
  function cerrarCapa() {
    if (!capaAbierta) return;
    capaAbierta.hidden = true;
    capaAbierta = null;
    document.body.style.overflow = '';
    if (focoPrevio && document.contains(focoPrevio)) focoPrevio.focus();
    focoPrevio = null;
  }

  function pintarBuscador(q) {
    var t = sinTildes(q || '').trim();
    var res = TODOS.filter(function (m) { return !t || sinTildes(m.nombre + ' ' + CAT[m.cat].nombre).indexOf(t) >= 0; });
    var lista = res.length ? res.map(function (m) {
      return '<li><a href="#modelo-' + m.id + '"><span class="r-art">' + arte(m, 0) + '</span><span class="r-txt"><strong>' + esc(m.nombre) + '</strong><span>' + esc(CAT[m.cat].nombre) + ' · ' + money(m.precio) + '</span></span></a></li>';
    }).join('') : '<li class="fine">No encontramos modelos con “' + esc(q) + '”. Probá con otra palabra.</li>';
    document.getElementById('resultados').innerHTML = lista;
  }

  function abrirBuscador() {
    document.getElementById('buscar-panel').innerHTML =
      '<div class="layer-head"><h2 id="buscar-t" style="font-family:var(--font-body);font-size:18px;font-weight:900">Buscar en la tienda</h2><button type="button" class="icon-btn" data-action="cerrar-capa" aria-label="Cerrar">' + ico('close', 22) + '</button></div>' +
      '<div class="field"><label for="buscar-q" class="sr">Nombre del producto</label><input id="buscar-q" type="search" placeholder="Ej.: cartera, mochila, llavero" autocomplete="off"></div>' +
      '<ul class="results" id="resultados" aria-live="polite"></ul>';
    pintarBuscador('');
    abrirCapa('capa-buscar', 'buscar-q');
  }

  function abrirPago() {
    document.getElementById('pago-panel').innerHTML =
      '<span class="chip" style="align-self:flex-start">Simulación del prototipo</span>' +
      '<h2 id="pago-t">Pago con Mercado Pago</h2>' +
      '<p>En la tienda real, en este paso se abre el checkout oficial de Mercado Pago para pagar <strong style="color:var(--ink)">' + money(subtotal()) + '</strong> con tarjeta, débito o dinero en cuenta. Acá simulamos la respuesta para mostrar cómo sigue el pedido.</p>' +
      '<div class="modal-actions">' +
        '<button type="button" class="btn btn-primary" data-action="pago-ok">' + ico('check', 20, 2.4) + 'Simular pago aprobado</button>' +
        '<button type="button" class="btn btn-ghost" data-action="pago-rechazado">Simular pago rechazado</button>' +

      '</div>';

  var toastT = null;
  function aviso(html) {
    var t = document.getElementById('toast');
    t.innerHTML = html; t.hidden = false;
    clearTimeout(toastT);
    toastT = setTimeout(function () { t.hidden = true; }, 4000);
  }

  /* ================= Acciones ================= */
  function moverVitrina(delta) {
    var cat = rutaActual();
    if (!CAT[cat] || state.vista !== 'vitrina') return;
    var n = CAT[cat].modelos.length;
    if (n < 2) return;
    state.pos[cat] = ((state.pos[cat] || 0) + delta + n) % n;
    app.innerHTML = vVitrina(cat, delta);
    activarDeslizar();
  }

  function agregarAlPedido() {
    var d = state.det, m = MODELOS[d.id];
    if (d.bordado && !d.nombre.trim()) {
      marcarError('det-bordado-nombre', true);
      document.getElementById('det-bordado-nombre').focus();
      return;
    }
    var item = { id: m.id, color: d.color, bordado: d.bordado, nombreBordado: d.bordado ? d.nombre.trim() : '', notas: d.notas.trim(), cant: d.cant };
    var igual = state.carrito.find(function (x) {
      return x.id === item.id && x.color === item.color && x.bordado === item.bordado && x.nombreBordado === item.nombreBordado && x.notas === item.notas;
    });
    if (igual) igual.cant = Math.min(20, igual.cant + item.cant); else state.carrito.push(item);
    guardarCarrito();
    actualizarEncabezado(rutaActual());
    var b = document.getElementById('badge');
    b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump');
    aviso(ico('check', 18, 2.4) + '<span>Agregamos ' + esc(m.nombre) + ' a tu pedido</span><a href="#mi-pedido">Ver pedido</a>');
  }

  function crearPedido(pago) {
    state.nro += 1;
    guardar.set('mz-nro', state.nro);
    state.pedido = {
      nro: state.nro,
      cliente: JSON.parse(JSON.stringify(state.cliente)),
      items: JSON.parse(JSON.stringify(state.carrito)),
      total: subtotal(),
      pago: pago
    };
    guardar.set('mz-ultimo', state.pedido);
    state.carrito = [];
    state.pagoRechazado = false;
    guardarCarrito();
    location.hash = 'pedido-confirmado';
  }

  document.addEventListener('click', function (e) {
    var cap = e.target.classList && e.target.classList.contains('layer') ? e.target : null;
    if (cap && cap === capaAbierta) { cerrarCapa(); return; }
    var t = e.target.closest('[data-action]');
    if (!t) return;
    var a = t.dataset.action, k = +t.dataset.k;
    switch (a) {
      case 'abrir-info': abrirCapa('capa-info'); break;
      case 'abrir-buscar': abrirBuscador(); break;
      case 'cerrar-capa': cerrarCapa(); break;
      case 'vista':
        state.vista = t.dataset.v; guardar.set('mz-vista', state.vista);
        app.innerHTML = vVitrina(rutaActual()); activarDeslizar();
        var mismo = app.querySelector('[data-action="vista"][data-v="' + state.vista + '"]'); if (mismo) mismo.focus();
        break;
      case 'anterior': case 'siguiente':
        moverVitrina(a === 'siguiente' ? 1 : -1);
        var btn = app.querySelector('[data-action="' + a + '"]'); if (btn) btn.focus();
        break;
      case 'previa-color':
        var cat = rutaActual(), m = CAT[cat].modelos[state.pos[cat] || 0];
        state.previa[m.id] = +t.dataset.i;
        document.getElementById('stage-art').innerHTML = arte(m, +t.dataset.i);
        document.getElementById('dot-label').textContent = m.colores[+t.dataset.i].nombre;
        app.querySelectorAll('.dot').forEach(function (d) { d.setAttribute('aria-pressed', String(d === t)); });
        break;
      case 'det-color': state.det.color = +t.dataset.i; state.previa[state.det.id] = state.det.color; actualizarDetalle(); break;
      case 'det-menos': state.det.cant = Math.max(1, state.det.cant - 1); actualizarDetalle(); break;
      case 'det-mas': state.det.cant = Math.min(20, state.det.cant + 1); actualizarDetalle(); break;
      case 'agregar': agregarAlPedido(); break;
      case 'menos': case 'mas': case 'quitar':
        var it = state.carrito[k]; if (!it) break;
        if (a === 'quitar') state.carrito.splice(k, 1);
        else it.cant = Math.max(1, Math.min(20, it.cant + (a === 'mas' ? 1 : -1)));
        guardarCarrito();
        app.innerHTML = vCarrito();
        actualizarEncabezado('mi-pedido');
        var foco = app.querySelector('[data-action="' + a + '"][data-k="' + k + '"]') || app.querySelector('h1');
        if (foco) foco.focus();
        break;
      case 'pago-ok': cerrarCapa(); crearPedido('mp'); break;
      case 'pago-rechazado':
        cerrarCapa(); state.pagoRechazado = true;
        var ban = document.getElementById('f-banner'); if (ban) { ban.hidden = false; ban.scrollIntoView({ block: 'center' }); }
        break;
      case 'copiar':
        var estado = document.getElementById('copia-estado');
        var texto = mensajeWhatsApp(state.pedido);
        try {
          navigator.clipboard.writeText(texto).then(function () { estado.textContent = 'Mensaje copiado. Pegalo en el chat de Manzanitas.'; },
            function () { estado.textContent = 'No se pudo copiar automáticamente: seleccioná el texto del mensaje y copialo.'; });
        } catch (err) { estado.textContent = 'No se pudo copiar automáticamente: seleccioná el texto del mensaje y copialo.'; }
        break;
    }
  });

  document.addEventListener('input', function (e) {
    var id = e.target.id;
    if (id === 'det-bordado-nombre') { state.det.nombre = e.target.value; if (e.target.value.trim()) marcarError(id, false); }
    else if (id === 'det-notas') state.det.notas = e.target.value;
    else if (id === 'buscar-q') pintarBuscador(e.target.value);
    else if (e.target.form && e.target.form.id === 'form-pedido' && e.target.type !== 'radio') {
      state.cliente[e.target.name] = e.target.value;
      if (e.target.getAttribute('aria-invalid') === 'true') marcarError(id, false);
    }
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'det-bordado') {
      state.det.bordado = t.checked; actualizarDetalle();
      if (t.checked) document.getElementById('det-bordado-nombre').focus();
    } else if (t.form && t.form.id === 'form-pedido' && t.type === 'radio') {
      state.cliente[t.name] = t.value;
      if (t.name === 'pago') { state.pagoRechazado = false; document.getElementById('f-banner').hidden = true; }
      actualizarFinalizar();
    }
  });

  document.addEventListener('submit', function (e) {
    if (e.target.id === 'buscar-form') { e.preventDefault(); return; }
    if (e.target.id !== 'form-pedido') return;
    e.preventDefault();
    if (!validarPedido()) return;
    if (state.cliente.pago === 'mp') abrirPago(); else crearPedido('efectivo');
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && capaAbierta) { cerrarCapa(); return; }
    if (e.key === 'Enter' && e.target.id === 'buscar-q') {
      var primero = document.querySelector('#resultados a'); if (primero) { e.preventDefault(); primero.click(); }
      return;
    }
    if (capaAbierta || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if (!CAT[rutaActual()] || state.vista !== 'vitrina') return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); moverVitrina(1); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); moverVitrina(-1); }
  });

  function activarDeslizar() {
    var el = document.getElementById('stage-art');
    if (!el) return;
    var x0 = null, y0 = null, deslizo = false;
    el.addEventListener('pointerdown', function (e) { x0 = e.clientX; y0 = e.clientY; deslizo = false; });
    el.addEventListener('pointerup', function (e) {
      if (x0 === null) return;
      var dx = e.clientX - x0, dy = e.clientY - y0;
      x0 = null;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { deslizo = true; setTimeout(function () { moverVitrina(dx < 0 ? 1 : -1); }, 0); }
    });
    el.addEventListener('click', function (e) { if (deslizo) { e.preventDefault(); deslizo = false; } });
  }

  /* ================= Rutas ================= */
  function rutaActual() { return decodeURIComponent(location.hash.replace(/^#/, '')); }

  function pintar(inicial) {
    var r = rutaActual(), html, titulo = 'Tienda Manzanitas';
    cerrarCapa();
    if (CAT[r]) {
      state.ultimaCat = r; html = vVitrina(r); titulo = CAT[r].nombre + ' · Manzanitas';
    } else if (r.indexOf('modelo-') === 0 && MODELOS[r.slice(7)]) {
      var m = MODELOS[r.slice(7)]; state.ultimaCat = m.cat; html = vDetalle(m); titulo = m.nombre + ' · Manzanitas';
    } else if (r === 'mi-pedido') {
      html = vCarrito(); titulo = 'Mi pedido · Manzanitas';
    } else if (r === 'finalizar') {
      if (!state.carrito.length) { location.hash = 'mi-pedido'; return; }
      html = vFinalizar(); titulo = 'Finalizar pedido · Manzanitas';
    } else if (r === 'pedido-confirmado' && state.pedido) {
      html = vConfirmado(); titulo = 'Pedido #' + state.pedido.nro + ' · Manzanitas';
    } else {
      html = vInicio();
    }
    app.innerHTML = html;
    document.title = titulo;
    actualizarEncabezado(r);
    activarDeslizar();
    if (!inicial) {
      window.scrollTo(0, 0);
      var h = app.querySelector('h1');
      if (h) h.focus({ preventScroll: true });
    }
  }

  window.addEventListener('hashchange', function () { pintar(false); });
  pintarEncabezado();
  pintar(true);
})();
</script>
</body>
</html>
